<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyeux Anniversaire Fortune! 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Confetti Animation */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
        }

        /* Sparkle effects */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Main Card */
        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(233, 30, 99, 0.3);
            position: relative;
            overflow: hidden;
            animation: cardAppear 1s ease-out;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #e91e63, #f06292, #f48fb1, #f06292, #e91e63);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Birthday Header */
        .birthday-header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out 0.3s both;
        }

        .cake-emoji {
            font-size: 60px;
            display: block;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .birthday-title {
            font-size: 42px;
            background: linear-gradient(135deg, #e91e63, #c2185b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .birthday-name {
            font-size: 52px;
            color: #e91e63;
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(233, 30, 99, 0.2);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(233, 30, 99, 0.3); }
            to { text-shadow: 0 0 30px rgba(233, 30, 99, 0.6), 0 0 60px rgba(233, 30, 99, 0.3); }
        }

        .age-badge {
            display: inline-block;
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Photo Gallery */
        .photo-gallery {
            margin: 30px 0;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .photo-frame {
            position: relative;
            margin: 20px auto;
            width: 250px;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.3);
            border: 5px solid white;
            display: none;
        }

        .photo-frame.active {
            display: block;
            animation: photoAppear 0.8s ease-out;
        }

        @keyframes photoAppear {
            from {
                opacity: 0;
                transform: scale(0.8) rotate(-5deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-frame::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 3px solid #f48fb1;
            border-radius: 15px;
            pointer-events: none;
        }

        /* Photo Navigation */
        .photo-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #e91e63, #f06292);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.3);
        }

        .nav-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4);
        }

        .photo-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f8bbd0;
            transition: all 0.3s;
            cursor: pointer;
        }

        .dot.active {
            background: #e91e63;
            transform: scale(1.2);
        }

        /* Message Section */
        .message-section {
            text-align: center;
            margin-top: 30px;
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        .message-text {
            font-size: 20px;
            color: #880e4f;
            line-height: 1.6;
            font-style: italic;
        }

        .hearts {
            font-size: 30px;
            margin-top: 15px;
            animation: heartBeat 1.5s infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }

        /* Floating Elements */
        .floating-hearts {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Music Note Animation */
        .music-notes {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            animation: musicFloat 3s infinite;
        }

        @keyframes musicFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 25px;
                margin: 10px;
            }
            .birthday-title {
                font-size: 28px;
            }
            .birthday-name {
                font-size: 36px;
            }
            .photo-frame {
                width: 200px;
                height: 240px;
            }
        }

        /* Balloon Animation */
        .balloon-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            width: 50px;
            height: 65px;
            border-radius: 50%;
            animation: balloonRise linear infinite;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background: rgba(233, 30, 99, 0.5);
        }

        @keyframes balloonRise {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0.8;
            }
            25% {
                transform: translateY(-30vh) translateX(20px);
            }
            50% {
                transform: translateY(-60vh) translateX(-20px);
            }
            75% {
                transform: translateY(-90vh) translateX(15px);
            }
            100% {
                transform: translateY(-120vh) translateX(0);
                opacity: 0;
            }
        }

        /* Music/Autoplay indicators */
        .autoplay-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(233, 30, 99, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            z-index: 100;
            transition: background 0.3s;
            user-select: none;
        }

        .autoplay-indicator:hover {
            background: rgba(233, 30, 99, 1);
        }

        #musicBtn {
            right: 170px;
        }
    </style>
</head>
<body>
    <!-- Confetti Container -->
    <div class="confetti-container" id="confetti"></div>

    <!-- Floating Hearts -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- Balloons -->
    <div class="balloon-container" id="balloons"></div>

    <!-- Main Card -->
    <div class="card-container">
        <div class="card">
            <div class="music-notes">🎵🎶🎵</div>
            
            <!-- Header -->
            <div class="birthday-header">
                <span class="cake-emoji">🎂</span>
                <h1 class="birthday-title">Joyeux Anniversaire!</h1>
                <h2 class="birthday-name">FORTUNE</h2>
                <div class="age-badge">🎉 20 ans 🎉</div>
            </div>

            <!-- Photo Gallery -->
            <div class="photo-gallery">
                <div class="photo-frame" data-index="0">
                    <img src="image/0.jpeg" alt="Goria">
                </div>
                <div class="photo-frame active" data-index="1">                    
                    <img src="image/1.jpeg" alt="Fortune">
                </div>
                <div class="photo-frame" data-index="2">
                    <img src="image/2.jpeg" alt="Fortune">
                </div>
                <div class="photo-frame" data-index="3">
                    <img src="image/3.jpeg" alt="Fortune">
                </div>
                <div class="photo-frame" data-index="4">
                    <img src="image/4.jpeg" alt="Fortune">
                </div>
                <div class="photo-frame" data-index="5">
                    <img src="image/5.jpeg" alt="Fortune">
                </div>
                <div class="photo-frame" data-index="6">
                    <img src="image/6.jpeg" alt="Fortune">
                </div>
                <div class="photo-frame" data-index="7">
                    <img src="image/7.jpeg" alt="Fortune">
                </div>
                <div class="photo-frame" data-index="8">
                    <img src="image/8.jpeg" alt="Fortune">
                </div>
                <div class="photo-frame" data-index="Fortune">
                    <img src="image/9.jpeg" alt="Fortune">
                </div>

                <div class="photo-nav">
                    <button class="nav-btn" onclick="prevPhoto()">◀</button>
                    <div class="photo-dots">
                        <div class="dot active" onclick="goToPhoto(0)"></div>
                        <div class="dot" onclick="goToPhoto(1)"></div>
                        <div class="dot" onclick="goToPhoto(2)"></div>
                        <div class="dot" onclick="goToPhoto(3)"></div>
                        <div class="dot" onclick="goToPhoto(4)"></div>
                        <div class="dot" onclick="goToPhoto(5)"></div>
                        <div class="dot" onclick="goToPhoto(6)"></div>
                        <div class="dot" onclick="goToPhoto(7)"></div>
                        <div class="dot" onclick="goToPhoto(8)"></div>
                        <div class="dot" onclick="goToPhoto(9)"></div>
                    </div>
                    <button class="nav-btn" onclick="nextPhoto()">▶</button>
                </div>
            </div>

            <!-- Message -->
            <div class="message-section">
                <p class="message-text">
                    Que cette journée soit aussi belle que toi!<br>
                    Tu mérites tout le bonheur du monde 💕
                </p>
                <div class="hearts">💖🌸💖🌸💖</div>
            </div>
        </div>
    </div>

    <!-- Hidden audio element -->
    <audio id="birthdayMusic" loop preload="auto">
        <source src="happy-birthday.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Controls -->
    <div class="autoplay-indicator" id="autoplayBtn" onclick="toggleAutoplay()">
        🔄 Défilement auto: ON
    </div>
    <div class="autoplay-indicator" id="musicBtn" onclick="toggleMusic()">
        🎵 Musique: OFF
    </div>

    <script>
        // ===== GLOBAL STATE =====
        let isMusicPlaying = false;
        let isAutoplay = true;
        let currentPhoto = -1;
        const totalPhotos = 10;
        let autoplayInterval;

        // Photo Gallery
        let _currentPhoto = -1;

        function updatePhoto() {
            document.querySelectorAll('.photo-frame').forEach((frame, index) => {
                frame.classList.remove('active');
                if (index === currentPhoto) {
                    frame.classList.add('active');
                }
            });
            document.querySelectorAll('.dot').forEach((dot, index) => {
                dot.classList.remove('active');
                if (index === currentPhoto) {
                    dot.classList.add('active');
                }
            });
        }

        function nextPhoto() {
            currentPhoto = (currentPhoto + 1) % totalPhotos;
            updatePhoto();
        }

        function prevPhoto() {
            currentPhoto = (currentPhoto - 1 + totalPhotos) % totalPhotos;
            updatePhoto();
        }

        function goToPhoto(index) {
            currentPhoto = index;
            updatePhoto();
        }

        function toggleAutoplay() {
            isAutoplay = !isAutoplay;
            const btn = document.getElementById('autoplayBtn');
            btn.textContent = isAutoplay ? '🔄 Défilement auto: ON' : '⏸️ Défilement auto: OFF';
            if (isAutoplay) {
                startAutoplay();
            } else {
                clearInterval(autoplayInterval);
            }
        }

        function startAutoplay() {
            autoplayInterval = setInterval(nextPhoto, 3000);
        }

        // Confetti
        function createConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#e91e63', '#f06292', '#f48fb1', '#f8bbd0', '#fce4ec', '#ffd54f', '#81d4fa', '#a5d6a7'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.opacity = Math.random() * 0.5 + 0.5;
                
                const animationDuration = Math.random() * 3 + 2;
                confetti.style.animation = `fall ${animationDuration}s linear infinite`;
                confetti.style.animationDelay = Math.random() * 5 + 's';
                
                container.appendChild(confetti);
            }
        }

        // Add falling animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                0% {
                    transform: translateY(0) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Floating Hearts
        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const hearts = ['💖', '💕', '💗', '🌸', '✨', '💝', '🎀'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = Math.random() * 5 + 5 + 's';
                heart.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(heart);
            }
        }

        // Balloons
        function createBalloons() {
            const container = document.getElementById('balloons');
            const balloonColors = ['#e91e63', '#f06292', '#f48fb1', '#f8bbd0', '#ce93d8', '#ba68c8'];
            
            for (let i = 0; i < 8; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.left = Math.random() * 90 + 5 + '%';
                balloon.style.backgroundColor = balloonColors[Math.floor(Math.random() * balloonColors.length)];
                balloon.style.animationDuration = Math.random() * 8 + 10 + 's';
                balloon.style.animationDelay = Math.random() * 15 + 's';
                balloon.style.width = Math.random() * 20 + 40 + 'px';
                balloon.style.height = Math.random() * 25 + 55 + 'px';
                container.appendChild(balloon);
            }
        }

        // Sparkles around the card
        function createSparkles() {
            const card = document.querySelector('.card');
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                card.appendChild(sparkle);
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            createConfetti();
            createFloatingHearts();
            createBalloons();
            createSparkles();
            startAutoplay();
            
            // Auto-start music
            const audio = document.getElementById('birthdayMusic');
            audio.volume = 0.5;
            audio.play().then(() => {
                isMusicPlaying = true;
                document.getElementById('musicBtn').textContent = '🎵 Musique: ON';
            }).catch(err => {
                console.log('Autoplay blocked by browser - user interaction needed');
            });
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPhoto();
            if (e.key === 'ArrowLeft') prevPhoto();
            if (e.key === ' ') {
                e.preventDefault();
                toggleAutoplay();
            }
        });

        // Touch swipe support
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextPhoto();
                else prevPhoto();
            }
        });

        // ===== MUSIC - Real MP3 File =====
        function toggleMusic() {
            const audio = document.getElementById('birthdayMusic');
            const btn = document.getElementById('musicBtn');
            
            if (!isMusicPlaying) {
                audio.volume = 0.5;
                audio.play().then(() => {
                    isMusicPlaying = true;
                    btn.textContent = '🎵 Musique: ON';
                }).catch(err => {
                    console.log('Autoplay blocked:', err);
                    btn.textContent = '🎵 Cliquez pour jouer';
                });
            } else {
                audio.pause();
                audio.currentTime = 0;
                isMusicPlaying = false;
                btn.textContent = '🎵 Musique: OFF';
            }
        }
    </script>
</body>
</html>
